<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if auto_refresh %}<meta http-equiv="refresh" content="3">{% endif %}
    <script>
      (function () {
        const saved = localStorage.getItem("autovpn-theme");
        document.documentElement.dataset.theme = saved || "dark";
      })();
    </script>
    <title>AutoVPN Admin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --panel-soft: #fbfcfd;
        --border: #d7dce2;
        --text: #20242a;
        --muted: #66707c;
        --accent: #0f766e;
        --accent-hover: #115e59;
        --danger: #b42318;
        --code-bg: #eef1f5;
        --pre-bg: #111827;
        --pre-text: #e5e7eb;
        --header-bg: #111827;
        --header-text: #ffffff;
        --nav-text: #d1d5db;
        --input-bg: #ffffff;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --panel-soft: #1f2630;
        --border: #303844;
        --text: #e6edf3;
        --muted: #9aa7b4;
        --accent: #14b8a6;
        --accent-hover: #2dd4bf;
        --danger: #f87171;
        --code-bg: #222a35;
        --pre-bg: #070b12;
        --pre-text: #d7dee8;
        --header-bg: #070b12;
        --header-text: #f8fafc;
        --nav-text: #b8c2cc;
        --input-bg: #0f141b;
      }
      body {
        margin: 0;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        background: var(--header-bg);
        color: var(--header-text);
        padding: 14px 28px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      header strong { font-size: 17px; }
      nav {
        flex: 1;
      }
      nav a {
        color: var(--nav-text);
        margin-right: 16px;
        text-decoration: none;
      }
      nav a:hover { color: var(--header-text); }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px;
      }
      .panel, table {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .panel { padding: 18px; }
      .label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .value {
        font-size: 20px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .muted { color: var(--muted); }
      .danger { color: var(--danger); }
      .ok { color: var(--accent); }
      button, input[type="submit"], a.button {
        display: inline-block;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        padding: 9px 13px;
        font-weight: 650;
        cursor: pointer;
        text-decoration: none;
      }
      button:hover, input[type="submit"]:hover, a.button:hover {
        background: var(--accent-hover);
      }
      button[disabled] {
        opacity: .5;
        cursor: not-allowed;
      }
      .danger-button {
        background: var(--danger);
      }
      input[type="text"] {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
        min-width: 260px;
        background: var(--input-bg);
        color: var(--text);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 11px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        font-size: 13px;
        color: var(--muted);
        background: var(--panel-soft);
      }
      code {
        background: var(--code-bg);
        border-radius: 5px;
        padding: 2px 5px;
        overflow-wrap: anywhere;
      }
      form.inline { display: inline; }
      .actions { margin: 18px 0; }
      .action-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 24px;
      }
      .section-title h2 {
        margin: 0;
      }
      .client-list {
        display: grid;
        gap: 12px;
      }
      .client-details summary {
        cursor: pointer;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .client-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
        margin-top: 16px;
      }
      .technical-details {
        margin-top: 12px;
      }
      .technical-details summary {
        cursor: pointer;
        font-weight: 650;
        color: var(--muted);
      }
      .technical-details[open] summary {
        margin-bottom: 12px;
        color: var(--text);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--pre-bg);
        color: var(--pre-text);
        border-radius: 8px;
        padding: 14px;
      }
      .theme-toggle {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--header-text);
        padding: 7px 10px;
      }
      .theme-toggle:hover {
        background: rgba(255, 255, 255, .08);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>AutoVPN</strong>
      <nav>
        <a href="/admin">Dashboard</a>
        <a href="/admin/clients">Clients</a>
        <a href="/admin/operations">Operations</a>
      </nav>
      <button class="theme-toggle" type="button" onclick="toggleTheme()" title="Переключить тему">◐</button>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script>
      function toggleTheme() {
        const current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("autovpn-theme", next);
      }
    </script>
  </body>
</html>
