<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoVPN Admin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --border: #d7dce2;
        --text: #20242a;
        --muted: #66707c;
        --accent: #0f766e;
        --danger: #b42318;
      }
      body {
        margin: 0;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        background: #111827;
        color: #fff;
        padding: 14px 28px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      header strong { font-size: 17px; }
      nav a {
        color: #d1d5db;
        margin-right: 16px;
        text-decoration: none;
      }
      nav a:hover { color: #fff; }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px;
      }
      .panel, table {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .panel { padding: 18px; }
      .label {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }
      .value {
        font-size: 20px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .muted { color: var(--muted); }
      .danger { color: var(--danger); }
      .ok { color: var(--accent); }
      button, input[type="submit"], a.button {
        display: inline-block;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        padding: 9px 13px;
        font-weight: 650;
        cursor: pointer;
        text-decoration: none;
      }
      button[disabled] {
        opacity: .5;
        cursor: not-allowed;
      }
      .danger-button {
        background: var(--danger);
      }
      input[type="text"] {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
        min-width: 260px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 11px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        font-size: 13px;
        color: var(--muted);
        background: #fbfcfd;
      }
      code {
        background: #eef1f5;
        border-radius: 5px;
        padding: 2px 5px;
        overflow-wrap: anywhere;
      }
      form.inline { display: inline; }
      .actions { margin: 18px 0; }
      .action-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .client-list {
        display: grid;
        gap: 12px;
      }
      .client-details summary {
        cursor: pointer;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .client-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
        margin-top: 16px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #111827;
        color: #e5e7eb;
        border-radius: 8px;
        padding: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>AutoVPN</strong>
      <nav>
        <a href="/admin">Dashboard</a>
        <a href="/admin/clients">Clients</a>
        <a href="/admin/operations">Operations</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
