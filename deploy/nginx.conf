# Reference nginx config for AutoVPN.
#
# The app listens only on 127.0.0.1:8000, so nginx (or another TLS-terminating
# reverse proxy) is required to reach it from the network. Do NOT expose the
# app directly: the admin password, SSH and Aeza secrets travel over HTTP Basic
# and must be protected by TLS.
#
# Recommended setup:
#   1) point a domain at this server,
#   2) run: certbot --nginx -d vpn-admin.example.com --redirect
#      (certbot will add the TLS server block and the 80 -> 443 redirect).

server {
    listen 80;
    server_name vpn-admin.example.com;

    # Until TLS is configured, you can redirect to HTTPS:
    #   return 301 https://$host$request_uri;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Enable only once TLS is active:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
